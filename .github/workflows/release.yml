name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      # A release is worth cutting only from a tree that passes what every
      # change passes.
      - name: Test
        run: make test-race

      # The interface's built assets are committed, so the archives need
      # nothing but Go. The version comes from the tag rather than from
      # git describe, so the binary reports what was released.
      - name: Build release archives
        run: make dist VERSION="${GITHUB_REF_NAME#v}"

      # Drafted rather than published: a person makes the final pass on the
      # notes before anything is announced.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft --generate-notes --title "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/checksums.txt
