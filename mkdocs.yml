site_name: radblaster
site_description: A RADIUS load generator that puts subscriber traffic on authentication and accounting servers with no access network in the path.
site_url: https://docs.radblaster.ispx.co/
copyright: Copyright &copy; ISPX LIMITED

theme:
  name: shadcn
  icon: assets/images/ispx-icon.png
  topbar_sections: false
  pygments_style:
    light: shadcn-light
    dark: github-dark

plugins:
  - search

markdown_extensions:
  admonition:
  codehilite:
  fenced_code:
  footnotes:
  tables:
  attr_list:
  md_in_html:
  toc:
    permalink: true
  pymdownx.blocks.details:
  pymdownx.tabbed:
    alternate_style: true
  pymdownx.snippets:
  pymdownx.superfences:
    custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/js/copy-code.js
  - assets/js/powered-by.js

nav:
  - Home: index.md
  - Guides:
      - Quickstart: guides/quickstart.md
      - Subscriber sessions: guides/sessions.md
      - Dictionaries: guides/dictionaries.md
      - Profiles: guides/profiles.md
      - Web interface: guides/web-interface.md
  - Reading the results: results.md
  - How it works: how-it-works.md
