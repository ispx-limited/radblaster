version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - revive
    - unconvert
    - usetesting

  settings:
    revive:
      rules:
        - name: exported
          disabled: false

    errcheck:
      # Writes to the terminal cannot fail in a way the program could act on,
      # and checking each one would bury the reporting logic in noise.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

  exclusions:
    rules:
      # MD5 is not a choice here; the protocol specifies it.
      - path: internal/radius/
        text: "weak cryptographic primitive"

formatters:
  enable:
    - gofmt
