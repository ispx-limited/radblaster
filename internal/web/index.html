<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>radblaster</title>
<style>
:root {
  --bg: #0e0f13;
  --panel: #15171d;
  --card: #1a1d24;
  --line: rgba(255,255,255,0.08);
  --line-strong: rgba(255,255,255,0.14);
  --text: #e8eaed;
  --muted: #9aa0aa;
  --faint: #6b7280;
  --brand: #e53935;
  --brand-dim: #c62828;
  --ok: #22c55e;
  --warn: #f59e0b;
  --info: #2563eb;
  --radius: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--brand); }

header {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 22px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
  position: sticky; top: 0; z-index: 10;
}
.mark {
  width: 22px; height: 22px; border-radius: 6px; flex: none;
  background: linear-gradient(135deg, #e53935, #9b1c1c);
}
h1 { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.tagline { color: var(--faint); font-size: 12px; margin-left: 2px; }
.spacer { flex: 1; }

.state {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 12px; color: var(--muted);
  padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.state.running .dot { background: var(--ok); animation: pulse 1.4s ease-in-out infinite; }
.state.done .dot { background: var(--info); }
.state.failed .dot { background: var(--brand); }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

main { display: grid; grid-template-columns: 340px 1fr; gap: 18px; padding: 18px 22px 40px; align-items: start; }
@media (max-width: 980px) { main { grid-template-columns: 1fr; } }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
}
.card h2 {
  font-size: 11px; text-transform: uppercase; letter-spacing: .09em;
  color: var(--muted); margin: 0 0 12px; font-weight: 600;
}

form label { display: block; margin-bottom: 10px; }
form .lbl { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
input, select, textarea {
  width: 100%; padding: 7px 10px;
  background: #0f1116; color: var(--text);
  border: 1px solid var(--line-strong); border-radius: 7px;
  font: inherit; font-size: 13px;
}
textarea { resize: vertical; min-height: 58px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand-dim); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hint { font-size: 11px; color: var(--faint); margin-top: -6px; margin-bottom: 10px; }

details { margin: 4px 0 12px; }
summary { cursor: pointer; font-size: 12px; color: var(--muted); padding: 4px 0; user-select: none; }
summary:hover { color: var(--text); }

button {
  font: inherit; font-size: 13px; font-weight: 600;
  padding: 9px 14px; border-radius: 7px; border: 1px solid transparent;
  cursor: pointer; width: 100%;
}
button.primary { background: var(--brand-dim); color: #fff; }
button.primary:hover { background: var(--brand); }
button.ghost { background: transparent; color: var(--text); border-color: var(--line-strong); }
button.ghost:hover { border-color: var(--muted); }
button:disabled { opacity: .45; cursor: not-allowed; }

.err {
  margin-top: 12px; padding: 9px 11px; border-radius: 7px;
  background: rgba(229,57,53,.12); border: 1px solid rgba(229,57,53,.35);
  color: #ffb4b2; font-size: 12px;
}

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 13px 15px; }
.kpi .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.kpi .v { font-size: 25px; font-weight: 650; margin-top: 5px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.kpi .s { font-size: 11px; color: var(--faint); margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi.alert .v { color: var(--brand); }
.kpi.good .v { color: var(--ok); }

table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th {
  text-align: right; font-size: 10.5px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .07em; color: var(--faint); padding: 0 10px 8px; white-space: nowrap;
}
th:first-child, td:first-child { text-align: left; }
td { padding: 8px 10px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; }
td:first-child { font-weight: 550; }
td.zero { color: var(--faint); }
td.bad { color: var(--brand); }
td.warn { color: var(--warn); }
.empty { color: var(--faint); padding: 20px 0; text-align: center; font-size: 13px; }

.notes { list-style: none; margin: 0; padding: 0; }
.notes li {
  padding: 9px 12px; margin-bottom: 8px; font-size: 12.5px; line-height: 1.55;
  background: rgba(245,158,11,.07); border-left: 2px solid var(--warn); border-radius: 0 6px 6px 0;
  color: #e3d9c4;
}
.notes li:last-child { margin-bottom: 0; }

.chartwrap { position: relative; }
svg { display: block; width: 100%; height: 190px; }
.legend { display: flex; gap: 16px; font-size: 11.5px; color: var(--muted); margin-bottom: 8px; }
.legend i { display: inline-block; width: 9px; height: 2.5px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.stack { display: flex; flex-direction: column; gap: 18px; }
</style>
</head>
<body>

<header>
  <div class="mark"></div>
  <h1>radblaster</h1>
  <span class="tagline">RADIUS load testing</span>
  <div class="spacer"></div>
  <div class="state" id="state"><span class="dot"></span><span id="stateText">Idle</span></div>
</header>

<main>
  <div class="stack">
    <div class="card">
      <h2>Run</h2>
      <form id="form" autocomplete="off">
        <label><span class="lbl">Authentication server</span>
          <input name="server" placeholder="10.0.0.1:1812" required></label>
        <label><span class="lbl">Accounting server</span>
          <input name="acctServer" placeholder="leave empty to skip accounting"></label>
        <label><span class="lbl">Shared secret</span>
          <input name="secret" type="password" required></label>

        <div class="row">
          <label><span class="lbl">Sessions per second</span>
            <input name="rate" type="number" min="0" step="any" placeholder="0 for max"></label>
          <label><span class="lbl">Session count</span>
            <input name="count" type="number" min="0" placeholder="0"></label>
        </div>
        <div class="row">
          <label><span class="lbl">Duration</span>
            <input name="duration" placeholder="30s"></label>
          <label><span class="lbl">Hold online</span>
            <input name="hold" placeholder="0s"></label>
        </div>
        <p class="hint">A run needs either a count or a duration.</p>

        <details>
          <summary>Subscribers and attributes</summary>
          <label><span class="lbl">Username template</span>
            <input name="username" placeholder="subscriber{n}@example.net"></label>
          <label><span class="lbl">Password</span>
            <input name="password" type="password"></label>
          <div class="row">
            <label><span class="lbl">Method</span>
              <select name="auth"><option value="pap">PAP</option><option value="chap">CHAP</option></select></label>
            <label><span class="lbl">NAS-Identifier</span>
              <input name="nasIdentifier" placeholder="bng-01"></label>
          </div>
          <label><span class="lbl">Extra attributes, one per line</span>
            <textarea name="attributes" placeholder="Cisco-AVPair=ip:qos-policy-in=voice&#10;26.3561.1=eth 1/1/{n}"></textarea></label>
        </details>

        <details>
          <summary>Accounting and timing</summary>
          <div class="row">
            <label><span class="lbl">Interim interval</span>
              <input name="interim" placeholder="300s"></label>
            <label><span class="lbl">Timeout</span>
              <input name="timeout" placeholder="5s"></label>
          </div>
          <div class="row">
            <label><span class="lbl">Traffic up, octets/s</span>
              <input name="trafficUp" type="number" min="0" placeholder="0"></label>
            <label><span class="lbl">Traffic down, octets/s</span>
              <input name="trafficDown" type="number" min="0" placeholder="0"></label>
          </div>
          <div class="row">
            <label><span class="lbl">Links per endpoint</span>
              <input name="links" type="number" min="0" placeholder="auto"></label>
            <label><span class="lbl">Retries</span>
              <input name="retries" type="number" min="0" value="2"></label>
          </div>
          <label><span class="lbl">Accept CoA and Disconnect on</span>
            <input name="coaListen" placeholder=":3799"></label>
          <label><span class="lbl">Seed</span>
            <input name="seed" type="number" min="0" placeholder="0 for a fresh one"></label>
        </details>

        <button class="primary" id="start" type="submit">Start run</button>
      </form>
      <button class="ghost" id="stop" style="margin-top:8px; display:none">Stop</button>
      <div class="err" id="err" style="display:none"></div>
    </div>
  </div>

  <div class="stack">
    <div class="kpis" id="kpis"></div>

    <div class="card chartwrap">
      <h2>Rates</h2>
      <div class="legend">
        <span><i style="background:#e53935"></i>Offered</span>
        <span><i style="background:#22c55e"></i>Answered</span>
        <span><i style="background:#f59e0b"></i>Lost</span>
      </div>
      <svg id="rates" viewBox="0 0 600 190" preserveAspectRatio="none"></svg>
    </div>

    <div class="card chartwrap">
      <h2>Authentication latency, 95th percentile</h2>
      <div class="legend">
        <span><i style="background:#2563eb"></i>From scheduled send</span>
        <span><i style="background:#6b7280"></i>From actual send</span>
      </div>
      <svg id="latency" viewBox="0 0 600 190" preserveAspectRatio="none"></svg>
    </div>

    <div class="card">
      <h2>Exchanges</h2>
      <div id="table"></div>
    </div>

    <div class="card" id="dynwrap" style="display:none">
      <h2>Server-initiated</h2>
      <div id="dyntable"></div>
    </div>

    <div class="card" id="noteswrap" style="display:none">
      <h2>Notes</h2>
      <ul class="notes" id="notes"></ul>
    </div>
  </div>
</main>

<script>
"use strict";

const $ = (id) => document.getElementById(id);

// A bounded history keeps memory and the DOM flat however long a run goes on.
const MAX_POINTS = 240;
const history = { t: [], offered: [], answered: [], lost: [], p95: [], svc: [] };
let lastElapsed = -1;

function fmtDur(ns) {
  if (!ns) return "-";
  if (ns < 1000) return ns + "ns";
  if (ns < 1e6) return (ns / 1e3).toFixed(ns < 1e4 ? 1 : 0) + "µs";
  if (ns < 1e9) return (ns / 1e6).toFixed(ns < 1e7 ? 2 : 1) + "ms";
  return (ns / 1e9).toFixed(2) + "s";
}
function fmtNum(n) {
  if (n === undefined || n === null) return "0";
  if (n < 10000) return String(n);
  if (n < 1e6) return (n / 1e3).toFixed(1) + "k";
  return (n / 1e6).toFixed(2) + "M";
}
function fmtRate(n) { return fmtNum(Math.round(n || 0)) + "/s"; }

function setState(s) {
  const el = $("state");
  el.className = "state " + s;
  $("stateText").textContent = { idle: "Idle", running: "Running", done: "Finished", failed: "Failed" }[s] || s;
  const running = s === "running";
  $("start").disabled = running;
  $("stop").style.display = running ? "block" : "none";
}

function kpi(label, value, sub, tone) {
  return '<div class="kpi ' + (tone || "") + '"><div class="k">' + label + '</div>' +
         '<div class="v">' + value + '</div>' +
         '<div class="s">' + (sub || "&nbsp;") + '</div></div>';
}

function renderKPIs(st) {
  const a = st.exchanges && st.exchanges.length ? st.exchanges[0] : null;
  let lost = 0, retried = 0;
  (st.exchanges || []).forEach(e => { lost += e.timeouts; retried += e.retransmits; });

  const cards = [
    kpi("Sessions", fmtNum(a ? a.sent : 0),
        st.state === "running" ? fmtRate(st.setupRate) + " now" : fmtRate(st.achievedRate) + " achieved"),
    kpi("Online", fmtNum(st.sessionsOnline), st.sessionsCompleted ? fmtNum(st.sessionsCompleted) + " completed" : ""),
    // Outstanding climbs before any latency figure moves, because a request
    // has to time out before it can be counted slow.
    kpi("Awaiting reply", fmtNum(st.outstanding), "in flight"),
    kpi("p95 latency", a ? fmtDur(a.p95) : "-", a ? "p99 " + fmtDur(a.p99) : ""),
    kpi("Lost", fmtNum(lost), retried ? fmtNum(retried) + " retried" : "", lost ? "alert" : "good"),
  ];
  $("kpis").innerHTML = cards.join("");
}

function cell(v, cls) {
  const c = v === 0 ? "zero" : (cls || "");
  return '<td class="' + c + '">' + (typeof v === "number" ? fmtNum(v) : v) + "</td>";
}

function renderTable(st) {
  const rows = (st.exchanges || []).filter(e => e.sent > 0);
  if (!rows.length) {
    $("table").innerHTML = '<div class="empty">No requests sent yet.</div>';
    return;
  }
  let html = "<table><thead><tr><th>Exchange</th><th>Sent</th><th>OK</th><th>Rejected</th>" +
             "<th>Retried</th><th>Lost</th><th>Unverified</th><th>p50</th><th>p95</th><th>p99</th></tr></thead><tbody>";
  for (const e of rows) {
    html += "<tr><td>" + e.name + "</td>" +
      cell(e.sent) + cell(e.ok) + cell(e.rejected) +
      cell(e.retransmits, "warn") + cell(e.timeouts, "bad") + cell(e.unverified, "bad") +
      "<td>" + fmtDur(e.p50) + "</td><td>" + fmtDur(e.p95) + "</td><td>" + fmtDur(e.p99) + "</td></tr>";
  }
  $("table").innerHTML = html + "</tbody></table>";
}

function renderDynAuth(st) {
  const d = st.dynAuth || {};
  const total = (d.disconnectRequests || 0) + (d.coaRequests || 0) + (d.unverified || 0) + (d.malformed || 0);
  if (!total) { $("dynwrap").style.display = "none"; return; }
  $("dynwrap").style.display = "block";

  let html = "<table><thead><tr><th>Request</th><th>Received</th><th>Acknowledged</th><th>Refused</th></tr></thead><tbody>";
  if (d.disconnectRequests) {
    html += "<tr><td>Disconnect-Request</td>" + cell(d.disconnectRequests) + cell(d.disconnectAcks) + cell(d.disconnectNaks, "warn") + "</tr>";
  }
  if (d.coaRequests) {
    html += "<tr><td>CoA-Request</td>" + cell(d.coaRequests) + cell(d.coaAcks) + cell(d.coaNaks, "warn") + "</tr>";
  }
  if (d.unverified) {
    html += "<tr><td>Failed verification</td>" + cell(d.unverified, "bad") + "<td>-</td><td>-</td></tr>";
  }
  $("dyntable").innerHTML = html + "</tbody></table>";
}

function renderNotes(st) {
  const notes = st.notes || [];
  $("noteswrap").style.display = notes.length ? "block" : "none";
  $("notes").innerHTML = notes.map(n => "<li>" + n.replace(/[<>&]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" })[c]) + "</li>").join("");
}

// A small SVG line chart. Hand-drawn rather than pulled from a library so the
// page stays a single file with nothing to fetch.
function drawChart(el, series, opts) {
  const W = 600, H = 190, PAD_L = 46, PAD_B = 18, PAD_T = 8, PAD_R = 6;
  const n = history.t.length;
  if (n < 2) { el.innerHTML = ""; return; }

  let max = 0;
  for (const s of series) for (const v of s.data) if (v > max) max = v;
  if (max <= 0) max = 1;
  // Round the top of the scale up so the axis labels stay readable.
  const mag = Math.pow(10, Math.floor(Math.log10(max)));
  max = Math.ceil(max / mag) * mag;

  const x = (i) => PAD_L + (i / (n - 1)) * (W - PAD_L - PAD_R);
  const y = (v) => PAD_T + (1 - v / max) * (H - PAD_T - PAD_B);

  let svg = "";
  for (let g = 0; g <= 3; g++) {
    const v = (max / 3) * g, yy = y(v);
    svg += '<line x1="' + PAD_L + '" y1="' + yy + '" x2="' + (W - PAD_R) + '" y2="' + yy +
           '" stroke="rgba(255,255,255,0.055)" stroke-width="1"/>';
    svg += '<text x="' + (PAD_L - 7) + '" y="' + (yy + 3.5) + '" fill="#6b7280" font-size="9.5" text-anchor="end">' +
           opts.fmt(v) + "</text>";
  }
  for (const s of series) {
    let d = "";
    for (let i = 0; i < n; i++) d += (i ? "L" : "M") + x(i).toFixed(1) + " " + y(s.data[i]).toFixed(1);
    svg += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="1.7" ' +
           'stroke-linejoin="round" stroke-linecap="round"/>';
  }
  el.innerHTML = svg;
}

function push(st) {
  // Only record when the clock has actually advanced, so a redraw triggered by
  // something else does not flatten the time axis.
  if (st.elapsedMs === lastElapsed) return;
  lastElapsed = st.elapsedMs;

  const a = st.exchanges && st.exchanges.length ? st.exchanges[0] : null;
  history.t.push(st.elapsedMs);
  history.offered.push(st.setupRate || 0);
  history.answered.push(st.answerRate || 0);
  history.lost.push(st.lossRate || 0);
  history.p95.push(a ? a.p95 : 0);
  history.svc.push(a ? a.serviceP95 : 0);

  for (const k of Object.keys(history)) {
    if (history[k].length > MAX_POINTS) history[k].shift();
  }
}

function render(st) {
  setState(st.state);
  renderKPIs(st);
  renderTable(st);
  renderDynAuth(st);
  renderNotes(st);

  drawChart($("rates"), [
    { data: history.offered, color: "#e53935" },
    { data: history.answered, color: "#22c55e" },
    { data: history.lost, color: "#f59e0b" },
  ], { fmt: (v) => fmtNum(Math.round(v)) });

  drawChart($("latency"), [
    { data: history.p95, color: "#2563eb" },
    { data: history.svc, color: "#6b7280" },
  ], { fmt: fmtDur });

  $("err").style.display = st.error ? "block" : "none";
  $("err").textContent = st.error || "";
}

function collect() {
  const f = new FormData($("form"));
  const body = {};
  for (const [k, v] of f.entries()) {
    const s = String(v).trim();
    if (!s) continue;
    if (k === "attributes") { body[k] = s.split("\n").map(x => x.trim()).filter(Boolean); continue; }
    const numeric = ["rate", "count", "trafficUp", "trafficDown", "links", "retries", "seed", "nasPortType"];
    body[k] = numeric.includes(k) ? Number(s) : s;
  }
  if (body.retries === undefined) body.retries = 0;
  return body;
}

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("err").style.display = "none";
  for (const k of Object.keys(history)) history[k].length = 0;
  lastElapsed = -1;

  try {
    const res = await fetch("api/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(collect()),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "the run was refused");
    render(data);
  } catch (e) {
    $("err").style.display = "block";
    $("err").textContent = e.message;
  }
});

$("stop").addEventListener("click", async () => {
  try { await fetch("api/run", { method: "DELETE" }); } catch (e) { /* the stream will show the outcome */ }
});

// The stream carries the whole picture on every message, so a browser that
// arrives late or reconnects after a drop sees the full state rather than only
// what changed since.
function connect() {
  const es = new EventSource("api/events");
  es.onmessage = (ev) => {
    const st = JSON.parse(ev.data);
    if (st.state === "running") push(st);
    render(st);
  };
  es.onerror = () => { es.close(); setTimeout(connect, 1500); };
}

fetch("api/status").then(r => r.json()).then(render).catch(() => {});
connect();
</script>
</body>
</html>
